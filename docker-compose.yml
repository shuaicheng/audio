services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: ${APP_MODE:-live}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
    ports:
      - "8080:8080"
  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"
